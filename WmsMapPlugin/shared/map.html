<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS 地图</title>
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div id="control-panel">
      <!-- 图层管理 -->
      <div class="panel-section">
        <h3>图层管理</h3>
        <div class="layer-input-group">
          <input type="text" id="wms-url-input" placeholder="输入 WMS 服务 URL" />
          <button id="btn-add-layer" title="添加图层">添加</button>
        </div>
        <div id="layer-list" class="layer-list">
          <!-- 动态生成的图层项 -->
        </div>
        <button id="btn-refresh-capabilities" class="btn-secondary">获取图层信息</button>
        <button id="btn-zoom-layer" class="btn-secondary">缩放至图层</button>
      </div>

      <!-- 投影设置 -->
      <div class="panel-section">
        <h3>投影设置</h3>
        <div class="proj-input-group">
          <input type="text" id="epsg-input" placeholder="EPSG 编号 (如 4534)" />
          <button id="btn-query-epsg" title="从 epsg.io 查询">查询</button>
          <button id="btn-apply-proj" title="应用投影">应用</button>
        </div>
        <div id="current-proj-info" class="proj-info">当前: EPSG:4490</div>
        <!-- 自定义下拉：原生 select 在 WebView2 嵌入面板中会被宿主抢焦点收起 -->
        <div class="proj-dropdown" id="proj-dropdown">
          <button type="button" id="proj-dropdown-btn" class="proj-dropdown-btn">EPSG:4490</button>
          <ul class="proj-dropdown-list" id="proj-dropdown-list" style="display:none;"></ul>
        </div>
      </div>

      <!-- 出图 -->
      <div class="panel-section">
        <h3>出图</h3>
        <button id="btn-insert-map" class="btn-primary">插入地图到 CAD</button>
      </div>

      <div id="status-bar">就绪</div>
    </div>
  </div>
  <div id="toast-container"></div>

  <!-- Scripts (order matters) -->
  <script src="lib/proj4/proj4.js"></script>
  <script src="lib/leaflet/leaflet.js"></script>
  <script src="lib/proj4leaflet/proj4leaflet.js"></script>
  <script src="lib/html2canvas/html2canvas.min.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/projection.js"></script>
  <script src="js/wms.js"></script>
  <script src="js/map.js"></script>
  <script src="js/output.js"></script>
  <script src="js/error.js"></script>
  <script src="js/adapter.js"></script>

</body>
</html>
